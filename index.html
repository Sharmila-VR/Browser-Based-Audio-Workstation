<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraDAW - Professional Browser-Based Audio Workstation</title>
    <meta name="description" content="High performance client-side Digital Audio Workstation with sample-accurate scheduling, multi-resolution waveform rendering, AudioWorklet DSP, synthesizer, piano roll, and offline WAV export." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #0d0e14;
        color: #eceff4;
        font-family: 'Inter', sans-serif;
        user-select: none;
      }
      @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.4; }
        100% { opacity: 1; }
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #11121b;
      }
      ::-webkit-scrollbar-thumb {
        background: #282c3f;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3c425e;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
